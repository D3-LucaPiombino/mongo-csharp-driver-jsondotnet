name: .NET Core

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:    
      


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      # Clone
      contents: read
      # To publish nuget packages to the GitHub registry with GITHUB_TOKEN
      packages: write

    steps:
    - uses: actions/checkout@v6
      with:
        # Full history and tags: GitVersion needs them to compute the package version
        fetch-depth: 0
    - name: Run './build.sh Publish'
      run: ./build.sh Publish
      env:
        GitHubToken: ${{ secrets.GITHUB_TOKEN }}
